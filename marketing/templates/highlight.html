<!doctype html>
<!-- Highlight cover. CSS 540x540, rendered at deviceScaleFactor 2 -> 1080x1080 PNG.
     Instagram crops highlights to a centre circle: keep everything inside the 300 CSS px (600 px) centre disc.
     Slots: icon (short glyph or 1-2 letters), name (shown small under the icon; leave "" for icon-only). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=block">
<link rel="stylesheet" href="base.css">
<style>
  :root { --w: 540px; --h: 540px; }
  .canvas {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(70% 70% at 30% 25%, rgba(165, 146, 238, 0.9) 0%, rgba(165, 146, 238, 0) 70%),
      radial-gradient(70% 70% at 75% 80%, rgba(254, 134, 170, 0.85) 0%, rgba(254, 134, 170, 0) 70%),
      linear-gradient(160deg, var(--plum), #2a1430);
  }
  .disc {
    width: 300px; height: 300px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .icon { font-family: var(--font-head); font-weight: 600; font-size: 92px; line-height: 1; letter-spacing: -0.03em; }
  .icon img { height: 96px; width: auto; display: block; }
  .name { font-family: var(--font-body); font-weight: 700; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.86); }
</style>
</head>
<body>
<div class="canvas" data-theme="dark">
  <div class="glass disc">
    <div class="icon" data-slot="icon"><img src="../../apps/web/public/brand/ventra-mark.png" alt=""></div>
    <div class="name" data-slot="name">Start here</div>
  </div>
</div>
<script src="fill.js"></script>
</body>
</html>
